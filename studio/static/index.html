<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Studio</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="vista.css">
</head>
<body>
<div class="window" id="win">
  <div class="titlebar pywebview-drag-region">
    <svg class="appicon" viewBox="0 0 16 16"><defs><linearGradient id="ai" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2b7fd0"/></linearGradient></defs><rect x="1" y="3" width="14" height="10" rx="1.5" fill="url(#ai)" stroke="#123c66"/><rect x="3" y="5" width="10" height="2" fill="#fff" opacity=".8"/><circle cx="12" cy="11" r="1" fill="#7cff6b"/></svg>
    <div class="title" id="title">Scan Studio</div>
    <div class="caption"><span title="Minimize" data-win="min">&#8211;</span><span title="Maximize" data-win="max">&#9744;</span><span class="close" title="Close" data-win="close">&#10005;</span></div>
  </div>
  <div class="client">
    <div class="cmdbar" id="cmdbar"></div>
    <div class="body">
      <div class="nav" id="nav"></div>
      <div class="main" id="main"></div>
      <div class="side" id="side"></div>
    </div>
    <div class="navbar" id="navbar"></div>
  </div>
</div>
<div class="drawer" id="drawer"></div>
<script src="app.js"></script>
</body>
</html>
